services:
  db:
    image: postgres:16-alpine
    container_name: registro-usuarios-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: registro_usuarios
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5434:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./database:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d registro_usuarios"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: registro-usuarios-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Postgres: "Host=db;Port=5432;Database=registro_usuarios;Username=postgres;Password=postgres"
    ports:
      - "18080:8080"

volumes:
  db_data:
